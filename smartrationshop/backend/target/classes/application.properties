# Server Port Configuration
server.port=8080

# Spring Application Name
spring.application.name=smart-ration-shop-backend
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_ration_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Tamilarasi2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization Settings
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging Level
logging.level.com.smartration=INFO
logging.level.org.springframework.web=INFO
