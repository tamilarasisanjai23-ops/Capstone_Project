<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasks - Disaster Relief</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->

    <nav>
        <h2>Disaster Relief</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="volunteer-dashboard.html">Dashboard</a>
            <a href="tasks.html">Tasks</a>
            <a href="login.html">Logout</a>
        </div>
    </nav>


    <!-- Task Page -->

    <div class="task-page">

        <h1>Relief Tasks</h1>

        <p class="task-subtitle">
            View and manage disaster relief tasks assigned to you.
        </p>


        <!-- Available Tasks -->

        <section class="task-section">

            <h2>Available Tasks</h2>

            <div class="task-container" id="availableTasks">

                <p>Loading tasks...</p>

            </div>

        </section>


        <!-- Assigned Tasks -->

        <section class="task-section">

            <h2>My Assigned Tasks</h2>

            <table id="assignedTaskTable">

                <tr>
                    <th>Task</th>
                    <th>Location</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

                <tr>
                    <td colspan="5">
                        Loading tasks...
                    </td>
                </tr>

            </table>

        </section>

    </div>


    <!-- JavaScript -->

    <script>

        const BACKEND_URL =
            "https://capstone-project-c6bv.onrender.com";


        /* ==========================
           LOAD TASKS
           ========================== */

        function loadTasks() {

            fetch(
                BACKEND_URL + "/api/tasks"
            )

                .then(function (response) {

                    if (!response.ok) {

                        throw new Error(
                            "Failed to load tasks"
                        );

                    }

                    return response.json();

                })

                .then(function (tasks) {

                    if (
                        !Array.isArray(tasks) ||
                        tasks.length === 0
                    ) {

                        createDefaultTasks();

                        return;

                    }


                    displayTasks(tasks);

                })

                .catch(function (error) {

                    console.error(
                        "Task loading error:",
                        error
                    );

                    document.getElementById(
                        "availableTasks"
                    ).innerHTML = `
                        <p>
                            Unable to load tasks.
                        </p>
                    `;

                });

        }


        /* ==========================
           CREATE DEFAULT TASKS
           ========================== */

        function createDefaultTasks() {

            const defaultTasks = [

                {
                    taskName: "Food Distribution",
                    location: "Trichy",
                    priority: "High",
                    status: "Pending"
                },

                {
                    taskName: "Medicine Distribution",
                    location: "Lalgudi",
                    priority: "Medium",
                    status: "Pending"
                },

                {
                    taskName: "Shelter Support",
                    location: "Srirangam",
                    priority: "High",
                    status: "Pending"
                }

            ];


            const requests =
                defaultTasks.map(function (task) {

                    return fetch(
                        BACKEND_URL + "/api/tasks",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(task)
                        }
                    );

                });


            Promise.all(requests)

                .then(function () {

                    loadTasks();

                })

                .catch(function (error) {

                    console.error(
                        "Default task creation error:",
                        error
                    );

                });

        }


        /* ==========================
           DISPLAY TASKS
           ========================== */

        function displayTasks(tasks) {

            const availableContainer =
                document.getElementById(
                    "availableTasks"
                );


            const assignedTable =
                document.getElementById(
                    "assignedTaskTable"
                );


            availableContainer.innerHTML = "";


            assignedTable.innerHTML = `
                <tr>
                    <th>Task</th>
                    <th>Location</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            `;


            tasks.forEach(function (task) {

                /* ==================
                   AVAILABLE TASK CARD
                   ================== */

                const card =
                    document.createElement("div");

                card.className =
                    "task-card";


                card.innerHTML = `

                    <h3>
                        ${task.taskName}
                    </h3>

                    <p>
                        Help with disaster relief
                        activities.
                    </p>

                    <p>
                        <strong>📍 Location:</strong>
                        ${task.location}
                    </p>

                    <p>
                        <strong>⏰ Status:</strong>
                        ${task.status}
                    </p>

                    <span class="priority ${getPriorityClass(task.priority)}">
                        ${task.priority} Priority
                    </span>

                    <br><br>

                    <button
                        class="task-btn"
                        onclick="acceptTask(
                            ${task.taskId},
                            this
                        )"
                        ${task.status !== "Pending"
                            ? "disabled"
                            : ""}
                    >
                        ${task.status === "Pending"
                            ? "Accept Task"
                            : task.status}
                    </button>

                `;


                availableContainer.appendChild(
                    card
                );


                /* ==================
                   ASSIGNED TASK TABLE
                   ================== */

                const row =
                    assignedTable.insertRow(-1);


                row.insertCell(0).textContent =
                    task.taskName;

                row.insertCell(1).textContent =
                    task.location;

                row.insertCell(2).textContent =
                    task.priority;


                const statusCell =
                    row.insertCell(3);


                const statusSpan =
                    document.createElement("span");

                statusSpan.className =
                    getStatusClass(task.status);

                statusSpan.textContent =
                    task.status;


                statusCell.appendChild(
                    statusSpan
                );


                const actionCell =
                    row.insertCell(4);


                const actionButton =
                    document.createElement("button");


                actionButton.className =
                    "update-btn";


                if (
                    task.status === "Pending"
                ) {

                    actionButton.textContent =
                        "Start";

                    actionButton.onclick =
                        function () {

                            updateTaskStatus(
                                task.taskId,
                                "In Progress"
                            );

                        };

                }
                else if (
                    task.status === "In Progress"
                ) {

                    actionButton.textContent =
                        "Complete";

                    actionButton.onclick =
                        function () {

                            updateTaskStatus(
                                task.taskId,
                                "Completed"
                            );

                        };

                }
                else {

                    actionButton.textContent =
                        "View";

                    actionButton.onclick =
                        function () {

                            alert(
                                "Task: " +
                                task.taskName +
                                "\nStatus: " +
                                task.status
                            );

                        };

                }


                actionCell.appendChild(
                    actionButton
                );

            });

        }


        /* ==========================
           ACCEPT TASK
           ========================== */

        function acceptTask(
            taskId,
            button
        ) {

            updateTaskStatus(
                taskId,
                "In Progress"
            );

        }


        /* ==========================
           UPDATE TASK STATUS
           ========================== */

        function updateTaskStatus(
            taskId,
            newStatus
        ) {

            fetch(
                BACKEND_URL +
                "/api/tasks/" +
                taskId +
                "/status?status=" +
                encodeURIComponent(
                    newStatus
                ),
                {
                    method: "PUT"
                }
            )

                .then(function (response) {

                    if (!response.ok) {

                        throw new Error(
                            "Failed to update task"
                        );

                    }

                    return response.json();

                })

                .then(function () {

                    alert(
                        "Task status updated to " +
                        newStatus
                    );

                    loadTasks();

                })

                .catch(function (error) {

                    console.error(
                        "Task update error:",
                        error
                    );

                    alert(
                        "Failed to update task."
                    );

                });

        }


        /* ==========================
           PRIORITY CLASS
           ========================== */

        function getPriorityClass(
            priority
        ) {

            if (!priority) {
                return "";
            }


            return priority
                .toLowerCase()
                .replace(
                    /\s+/g,
                    "-"
                );

        }


        /* ==========================
           STATUS CLASS
           ========================== */

        function getStatusClass(
            status
        ) {

            if (
                status === "Completed"
            ) {

                return "task-status completed";

            }


            if (
                status === "In Progress"
            ) {

                return "task-status progress";

            }


            return "task-status pending";

        }


        /* ==========================
           INITIAL LOAD
           ========================== */

        loadTasks();

    </script>

</body>

</html>
