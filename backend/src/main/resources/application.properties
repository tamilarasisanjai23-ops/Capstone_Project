# =================================================================
# VOLUNTEER DISASTER RELIEF SYSTEM - APPLICATION PROPERTIES
# =================================================================

server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/volunteer_disaster_relief?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=9a2f8c4e7b1d3f6a8e0c2b5d7e9f1a3c5e7b9d1f3a5c7e9b2d4f6a8c0e2b4d6
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.disaster.backend=DEBUG
